<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}EMS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">EMS</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a id="loginLink" class="nav-link" href="/login/">Login</a></li>
            <li class="nav-item"><a id="dashboardLink" class="nav-link" href="/dashboard/">Dashboard</a></li>
            <li class="nav-item"><a id="logoutBtn" class="nav-link" href="#">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Logout handler: calls the logout API, clears stored tokens and redirects to login.
      document.addEventListener('DOMContentLoaded', function () {
        const logout = document.getElementById('logoutBtn');
        const loginLink = document.getElementById('loginLink');
        const dashboardLink = document.getElementById('dashboardLink');

        // Toggle visibility based on token presence
        const access = localStorage.getItem('access');
        if (access) {
          if (loginLink) loginLink.style.display = 'none';
          if (dashboardLink) dashboardLink.style.display = 'block';
          if (logout) logout.style.display = 'block';
        } else {
          if (loginLink) loginLink.style.display = 'block';
          if (dashboardLink) dashboardLink.style.display = 'none';
          if (logout) logout.style.display = 'none';
        }

        if (!logout) return;
        logout.addEventListener('click', async function (e) {
          e.preventDefault();
          const refresh = localStorage.getItem('refresh');
          try {
            if (refresh) {
              await fetch('/api/auth/logout/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh })
              });
            }
          } catch (err) {
            console.warn('Logout request failed', err);
          }
          localStorage.removeItem('access');
          localStorage.removeItem('refresh');
          window.location.href = '/login/';
        });
      });
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
