{% extends "ems/base.html" %}

{% block title %}Change Password - EMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Change Password</h2>
    <div id="alert" class="alert d-none" role="alert"></div>
    <form id="changeForm">
      <div class="mb-3">
        <label for="old_password" class="form-label">Old Password</label>
        <input type="password" class="form-control" id="old_password" required>
      </div>
      <div class="mb-3">
        <label for="new_password" class="form-label">New Password</label>
        <input type="password" class="form-control" id="new_password" required>
      </div>
      <button class="btn btn-primary" type="submit">Change password</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('changeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const old_password = document.getElementById('old_password').value;
  const new_password = document.getElementById('new_password').value;
  const access = localStorage.getItem('access');
  const res = await fetch('/api/auth/change-password/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + access},
    body: JSON.stringify({old_password, new_password})
  });
  const data = await res.json();
  const alert = document.getElementById('alert');
  alert.classList.remove('d-none');
  if (res.ok) {
    alert.classList.add('alert-success');
    alert.textContent = data.detail || 'Password changed.';
  } else {
    alert.classList.add('alert-danger');
    alert.textContent = JSON.stringify(data);
  }
});
</script>
{% endblock %}
