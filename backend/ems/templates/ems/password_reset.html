{% extends "ems/base.html" %}

{% block title %}Password Reset - EMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Password Reset</h2>
    <div id="alert" class="alert d-none" role="alert"></div>
    <form id="resetForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <button class="btn btn-primary" type="submit">Send reset email</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const res = await fetch('/api/auth/password-reset/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email})
  });
  const data = await res.json();
  const alert = document.getElementById('alert');
  alert.classList.remove('d-none');
  if (res.ok) {
    alert.classList.add('alert-success');
    alert.textContent = data.detail || 'Email sent.';
  } else {
    alert.classList.add('alert-danger');
    alert.textContent = JSON.stringify(data);
  }
});
</script>
{% endblock %}
