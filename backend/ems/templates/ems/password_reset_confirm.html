{% extends "ems/base.html" %}

{% block title %}Set New Password - EMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Set New Password</h2>
    <div id="alert" class="alert d-none" role="alert"></div>
    <form id="confirmForm">
      <div class="mb-3">
        <label for="new_password" class="form-label">New Password</label>
        <input type="password" class="form-control" id="new_password" required>
      </div>
      <button class="btn btn-primary" type="submit">Set password</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const uidb64 = '{{ uidb64 }}';
const token = '{{ token }}';
document.getElementById('confirmForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const new_password = document.getElementById('new_password').value;
  const res = await fetch(`/api/auth/password-reset-confirm/${uidb64}/${token}/`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({new_password})
  });
  const data = await res.json();
  const alert = document.getElementById('alert');
  alert.classList.remove('d-none');
  if (res.ok) {
    alert.classList.add('alert-success');
    alert.textContent = data.detail || 'Password changed.';
  } else {
    alert.classList.add('alert-danger');
    alert.textContent = JSON.stringify(data);
  }
});
</script>
{% endblock %}
